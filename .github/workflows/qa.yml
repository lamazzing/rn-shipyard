name: QA

# End-to-end QA: runs the BUILT rn-shipyard CLI against throwaway Expo projects with real git,
# fastlane, Gradle and CocoaPods (tests/qa, `npm run test:qa`). No Apple account, no secrets.
# The `apple` job additionally runs the real thing (App Store Connect key, Match repo, TestFlight
# upload) in the protected environment `apple-qa`, on schedule / on demand / for release tags only.
# See CONTRIBUTING.md, "QA suite". release.yml gates npm publish on this via `uses: ./.github/workflows/qa.yml`.
#
# Reusable: a caller needs to grant only `contents: read`. Failure issues are NOT opened here (a
# called workflow sees the caller's event, e.g. a release tag push); .github/workflows/qa-report.yml
# does that from a workflow_run of this workflow's own runs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: catches new Expo / fastlane / Xcode releases
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a PR supersedes the running QA; main and nightly runs always finish.
concurrency:
  # per event: a push to main must not cancel a waiting nightly / manual run (it would skip the Apple job)
  group: qa-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (preinstalled on GitHub macOS images)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || { echo "::error::no Android SDK platforms on this image"; exit 1; }
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: fastlane and CocoaPods
        run: |
          brew install fastlane
          command -v pod || brew install cocoapods
          fastlane --version
          pod --version
          xcodebuild -version

      - run: npm ci
      - run: npm run lint
      # builds, then runs tests/qa; the JSON report lists the failing scenarios by name
      - name: QA suite
        run: npm run test:qa -- --reporter=verbose --reporter=json --outputFile.json=qa-results.json 2>&1 | tee qa.log; exit "${PIPESTATUS[0]}"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qa-logs
          path: |
            qa.log
            qa-results.json
          if-no-files-found: ignore
          retention-days: 14

  # Real Apple end to end: init (Match, API key only) -> build -> submit (TestFlight upload).
  # Every run uploads a build to TestFlight and needs secrets, so it never runs for pull requests or
  # pushes. In a called workflow github.event_name is the CALLER's: a release run is a push, so it is
  # recognised by its ref (refs/tags/v*). The environment only admits main and v* tags.
  #
  # Secrets are scoped by step: nothing secret exists while third-party code is installed (fixture
  # step), only init and build see the key, the Match password, the ssh-agent and the keychain, and
  # submit sees the key alone. No secret goes through GITHUB_ENV. Residual risk: during build,
  # `expo prebuild` config plugins and `pod install` still run fixture-dependency code (see CONTRIBUTING.md).
  apple:
    if: >-
      github.repository == 'lamazzing/rn-shipyard' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-15
    timeout-minutes: 90
    environment: apple-qa
    permissions:
      contents: read
    # Build numbers come from TestFlight (latest + 1): runs queue, never cancel. A release tag has its
    # own group so a pending tag run can never be replaced by a newer nightly or manual run.
    concurrency:
      group: qa-apple-${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'nightly' }}
      cancel-in-progress: false
    env: # variables, not secrets
      QA_BUNDLE_ID: ${{ vars.QA_BUNDLE_ID }}
      MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      # the image defaults to Xcode 16.4 (Swift 6.1); current Expo needs Swift 6.2 and
      # App Store uploads need an Xcode 26 SDK
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: fastlane and CocoaPods
        run: |
          brew install fastlane
          command -v pod || brew install cocoapods
          fastlane --version
          pod --version
          xcodebuild -version

      - run: npm ci
      - run: npm run build

      # create-expo-app and npm install run third-party code: do it first, with no secret anywhere
      # (the script refuses to install if one is in its environment). Versions are pinned in the script.
      - name: Fixture app (no secrets yet)
        # macOS runners export the system ssh-agent's (empty) socket; ours is started later
        run: env -u SSH_AUTH_SOCK node scripts/qa-apple.mjs --stage fixture --out "$GITHUB_WORKSPACE/qa-apple-out"

      # Secrets live in files / agents outside the checkout, mode 600, and are removed in the last step.
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"

      # Deploy key for the private Match repo: ssh-agent, never a file. GitHub's host keys come from
      # its API over TLS (not ssh-keyscan on first use). The socket goes to the steps that need it
      # through step outputs, not GITHUB_ENV.
      - name: ssh-agent for the Match repo
        id: agent
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          # authenticated: anonymous api.github.com calls from shared runner IPs get 403 (rate limit)
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          eval "$(ssh-agent -s)" > /dev/null
          echo "sock=$SSH_AUTH_SOCK" >> "$GITHUB_OUTPUT"
          echo "pid=$SSH_AGENT_PID" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$MATCH_DEPLOY_KEY" | ssh-add - 2> /dev/null
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          ssh-add -l

      # fastlane match on a CI Mac needs an unlocked keychain that is the default one. rn-shipyard's
      # lanes do not create one (a CI feature, not part of the product), so the workflow does.
      # The (masked) password reaches init and build as a step output; the keychain is deleted after build.
      - name: Temporary keychain
        id: kc
        run: |
          set -eu
          kc="$RUNNER_TEMP/qa-apple.keychain-db"
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::$pw"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$kc"
          echo "name=$kc" >> "$GITHUB_OUTPUT"
          echo "pw=$pw" >> "$GITHUB_OUTPUT"

      # The first run finds the Match repo empty: init's Match step (readonly: false) creates the
      # distribution certificate and App Store profile and pushes them; later runs reuse them.
      - name: init (Match, API key only, no Apple ID)
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SSH_AUTH_SOCK: ${{ steps.agent.outputs.sock }}
          MATCH_KEYCHAIN_NAME: ${{ steps.kc.outputs.name }}
          MATCH_KEYCHAIN_PASSWORD: ${{ steps.kc.outputs.pw }}
        run: node scripts/qa-apple.mjs --stage init --out "$GITHUB_WORKSPACE/qa-apple-out"

      - name: build
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SSH_AUTH_SOCK: ${{ steps.agent.outputs.sock }}
          MATCH_KEYCHAIN_NAME: ${{ steps.kc.outputs.name }}
          MATCH_KEYCHAIN_PASSWORD: ${{ steps.kc.outputs.pw }}
        run: node scripts/qa-apple.mjs --stage build --out "$GITHUB_WORKSPACE/qa-apple-out"

      # Signing is done: the write deploy key and the certificates leave the machine before the upload.
      - name: Stop ssh-agent and delete the keychain
        if: always()
        env:
          AGENT_PID: ${{ steps.agent.outputs.pid }}
          KEYCHAIN: ${{ steps.kc.outputs.name }}
        run: |
          [ -z "${AGENT_PID:-}" ] || kill "$AGENT_PID" 2> /dev/null || true
          if [ -n "${KEYCHAIN:-}" ]; then
            security default-keychain -d user -s login.keychain-db || true
            security list-keychains -d user -s login.keychain-db || true
            security delete-keychain "$KEYCHAIN" || true
          fi

      - name: submit (TestFlight, API key only)
        if: success()
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc/AuthKey.p8
        run: node scripts/qa-apple.mjs --stage submit --out "$GITHUB_WORKSPACE/qa-apple-out"

      # Only the redacted JSON documents and logs (scripts/qa-apple.mjs removes the password and the key)
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qa-apple-logs
          path: |
            qa-apple-out/*.json
            qa-apple-out/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove key and fixture
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" qa-apple-out/app
