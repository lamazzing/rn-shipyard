name: QA

# End-to-end QA: runs the BUILT rn-shipyard CLI against throwaway Expo projects with real git,
# fastlane, Gradle and CocoaPods (tests/qa, `npm run test:qa`). No Apple account, no secrets.
# See CONTRIBUTING.md, "QA suite". release.yml can depend on this via `uses: ./.github/workflows/qa.yml`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly: catches new Expo / fastlane / Xcode releases
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a PR supersedes the running QA; main and nightly runs always finish.
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (preinstalled on GitHub macOS images)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || { echo "::error::no Android SDK platforms on this image"; exit 1; }
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: fastlane and CocoaPods
        run: |
          brew install fastlane
          command -v pod || brew install cocoapods
          fastlane --version
          pod --version
          xcodebuild -version

      - run: npm ci
      - run: npm run lint
      # builds, then runs tests/qa; the JSON report lists the failing scenarios by name
      - name: QA suite
        run: npm run test:qa -- --reporter=verbose --reporter=json --outputFile.json=qa-results.json 2>&1 | tee qa.log; exit "${PIPESTATUS[0]}"

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: qa-logs
          path: |
            qa.log
            qa-results.json
          if-no-files-found: ignore
          retention-days: 14

  # One open issue labelled qa-failure per breakage: later failures add a comment.
  # Not for pull requests (the PR check is the signal) and not when called from another workflow.
  report:
    needs: qa
    if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: qa-logs
          path: qa-logs
        continue-on-error: true
      - name: Open or update the qa-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          failed="$(node -e '
            try {
              const r = JSON.parse(require("fs").readFileSync("qa-logs/qa-results.json", "utf8"));
              const names = r.testResults.flatMap((f) => f.assertionResults.filter((a) => a.status === "failed").map((a) => a.fullName));
              console.log(names.length ? names.map((n) => "- " + n).join("\n") : "- (no failed scenario in the report: the suite did not start, see the run log)");
            } catch { console.log("- (no report: the suite did not get far enough, see the run log)"); }
          ')"
          body="QA run failed (${EVENT}, ${SHA:0:7}): ${RUN_URL}"$'\n\n'"Failing scenarios:"$'\n'"${failed}"
          gh label create qa-failure --color B60205 --description "Automated QA suite failed" 2>/dev/null || true
          number="$(gh issue list --label qa-failure --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --label qa-failure --title "QA suite is failing" --body "$body"
          fi
