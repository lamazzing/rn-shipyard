name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed, after the QA workflow (qa.yml) and lint, tests and build pass.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret. Configured on npmjs.com →
# rn-shipyard → Settings → Trusted publishing → GitHub Actions, repository lamazzing/rn-shipyard,
# workflow release.yml, "Allow npm publish" on. The tag must match package.json's version.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # The QA suite incl. the real Apple end to end (init, build, TestFlight upload) must pass first.
  # `secrets: inherit` is needed for the called job to see the apple-qa environment secrets (without
  # it they are empty; v0.4.3 failed that way). The repo has no repository-level secrets, so nothing
  # else is passed. It never gets more than contents: read.
  qa:
    uses: ./.github/workflows/qa.yml
    secrets: inherit
    permissions:
      contents: read

  publish:
    needs: qa
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Trusted publishing (OIDC) needs a recent npm; the trusted publisher allows `npm publish`.
      - run: npm install -g npm@12.2.1
      - run: npm publish --provenance --access public
      # The registry lists a new version before its tarball is downloadable (404 for 2 to over 10 minutes;
      # v0.4.5 took longer than 10).
      # Finish only when both the metadata and the download work.
      - name: Wait until npm serves the new version
        run: |
          version="$(node -p 'require("./package.json").version')"
          url="https://registry.npmjs.org/rn-shipyard/-/rn-shipyard-${version}.tgz"
          for attempt in $(seq 1 120); do
            if curl -fsSIL "$url" > /dev/null && [ "$(npm view "rn-shipyard@${version}" version 2>/dev/null)" = "$version" ]; then
              echo "rn-shipyard@${version} is available (attempt ${attempt})"
              exit 0
            fi
            echo "Attempt ${attempt}/120: rn-shipyard@${version} not downloadable yet, retrying in 15s"
            sleep 15
          done
          echo "::error::rn-shipyard@${version} was published but is still not downloadable from ${url} after 30 minutes"
          exit 1
