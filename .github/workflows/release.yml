name: Release

# Stages an npm release when a version tag (v1.2.3) is pushed; it goes live after a maintainer
# approves it with 2FA. Uses npm trusted publishing (OIDC): no NPM_TOKEN secret. Configured on
# npmjs.com → rn-shipyard → Settings → Trusted publishing → GitHub Actions, repository
# lamazzing/rn-shipyard, workflow release.yml, "Allow npm publish" off. The tag must match
# package.json's version.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Staged, not live: a maintainer approves it with 2FA on npmjs.com (or `npm stage approve
      # <id>`). The trusted publisher only allows `npm stage publish`. Needs npm >= 12.
      - run: npm install -g npm@12
      - run: npm stage publish . --provenance --access public
