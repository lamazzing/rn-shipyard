name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed, after lint, tests and build pass.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret. Configured on npmjs.com →
# rn-shipyard → Settings → Trusted publishing → GitHub Actions, repository lamazzing/rn-shipyard,
# workflow release.yml, "Allow npm publish" on. The tag must match package.json's version.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Trusted publishing (OIDC) needs a recent npm; the trusted publisher allows `npm publish`.
      - run: npm install -g npm@12
      - run: npm publish --provenance --access public
      # The registry lists a new version before its tarball is downloadable (404 for ~2 minutes).
      # Finish only when both the metadata and the download work.
      - name: Wait until npm serves the new version
        run: |
          version="$(node -p 'require("./package.json").version')"
          url="https://registry.npmjs.org/rn-shipyard/-/rn-shipyard-${version}.tgz"
          for attempt in $(seq 1 40); do
            if curl -fsSIL "$url" > /dev/null && [ "$(npm view "rn-shipyard@${version}" version 2>/dev/null)" = "$version" ]; then
              echo "rn-shipyard@${version} is available (attempt ${attempt})"
              exit 0
            fi
            echo "Attempt ${attempt}/40: rn-shipyard@${version} not downloadable yet, retrying in 15s"
            sleep 15
          done
          echo "::error::rn-shipyard@${version} was published but is still not downloadable from ${url} after 10 minutes"
          exit 1
