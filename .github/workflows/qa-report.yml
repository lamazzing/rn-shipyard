name: QA report

# Opens (or comments on) ONE issue labelled qa-failure when the QA workflow fails on main
# (push) or in the nightly schedule. Separate from qa.yml so that qa.yml stays a safe
# `workflow_call` target that needs only `contents: read`. Pull request runs are not reported:
# the PR check is the signal. Runs from the default branch's copy of this file.

on:
  workflow_run:
    workflows: [QA]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write # open / comment
      actions: read # download the failed run's artifact
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: qa-logs
          path: qa-logs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: Open or update the qa-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVENT: ${{ github.event.workflow_run.event }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          failed="$(node -e '
            try {
              const r = JSON.parse(require("fs").readFileSync("qa-logs/qa-results.json", "utf8"));
              const names = r.testResults.flatMap((f) => f.assertionResults.filter((a) => a.status === "failed").map((a) => a.fullName));
              console.log(names.length ? names.map((n) => "- " + n).join("\n") : "- (no failed scenario in the report: the suite did not start, see the run log)");
            } catch { console.log("- (no report: the suite did not get far enough, see the run log)"); }
          ')"
          body="QA run failed (${EVENT}, ${SHA:0:7}): ${RUN_URL}"$'\n\n'"Failing scenarios:"$'\n'"${failed}"
          gh label create qa-failure --color B60205 --description "Automated QA suite failed" 2>/dev/null || true
          number="$(gh issue list --label qa-failure --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --label qa-failure --title "QA suite is failing" --body "$body"
          fi
